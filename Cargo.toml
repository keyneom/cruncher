[package]
name = "cruncher"
version = "0.2.3"
authors = ["Mika Sanchez <keyneom122@hotmail.com>"]
license = "MIT"
readme = "README.md"
description = """
jit-compiled mathematical expression calculator
"""
keywords = ["math", "expression", "calculator", "evaluator", "jit"]
categories = ["science"]
documentation = "https://docs.rs/cruncher"
homepage = "https://github.com/keyneom/cruncher"
repository = "https://github.com/keyneom/cruncher"
edition = "2021"
rust-version = "1.80"

[badges]
maintenance = { status = "experimental" }

[dependencies]
libm = "0.2"
cranelift = "0.134"
cranelift-module = "0.134"
cranelift-codegen = "0.134"
cranelift-jit = "0.134"
cranelift-native = "0.134"
hashbrown = "0.17"
rayon = "1.11"

[dev-dependencies]
test-case = "3"
criterion = "0.5"

[[bench]]
name = "eval_bench"
harness = false

